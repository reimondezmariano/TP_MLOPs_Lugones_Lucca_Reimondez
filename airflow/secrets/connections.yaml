# Conexiones de Airflow, leídas por LocalFilesystemBackend desde /opt/secrets.
# No llevan usuario ni clave: las credenciales de MinIO llegan por
# AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY desde el .env, y boto3 las toma
# del entorno cuando la conexión no las define.

aws_default:
  conn_type: aws
  extra:
    endpoint_url: http://s3:9000
    region_name: us-east-1

mlflow_default:
  conn_type: http
  host: mlflow
  port: 5000
  schema: http
