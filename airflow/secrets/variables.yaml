# Variables de Airflow, leídas por LocalFilesystemBackend desde /opt/secrets.
# Todos los valores van entre comillas: el backend los devuelve tal cual y
# Variable.get espera texto. Los números se convierten en el DAG.

# Rutas en MinIO
data_bucket: "data"
raw_data_path: "s3://data/raw/diabetic_data.csv"
processed_data_path: "s3://data/processed"
data_info_path: "s3://data/data_info/data.json"

# Parámetros del ETL
target_column: "readmitted"
random_seed: "42"
test_size: "0.2"

# MLflow (puerto interno de la red de Docker, no el 5001 del host)
mlflow_tracking_uri: "http://mlflow:5000"
mlflow_experiment_name: "reingreso_diabetes"
model_name: "reingreso_diabetes_rf"
champion_alias: "champion"
decision_threshold: "0.15"
